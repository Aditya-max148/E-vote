<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Election — DecenVote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes flagwave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-flag {
      background-size: 300% 300%;
      animation: flagwave 8s ease infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#FF8C00] via-[#FFFFFF] via-[#1A237E] to-[#0B6623] animate-flag text-gray-800 font-sans">
  <header class="bg-blue-700 text-white p-4 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-semibold">E-Vote</h1>
      <nav class="space-x-2 text-sm">
        <a href="home.html" class="px-3 py-1 rounded hover:bg-blue-500">Home</a>
        <a href="verify.html" class="px-3 py-1 rounded hover:bg-blue-500">Verify</a>
        <a href="register.html" class="px-3 py-1 rounded hover:bg-blue-500">Register</a>
        <a href="vote.html" class="px-3 py-1 rounded hover:bg-blue-500">Vote</a>
        <a href="results.html" class="px-3 py-1 rounded hover:bg-blue-500">Live Results</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto mt-10 backdrop-blur-xl bg-white/20 shadow-2xl rounded-2xl p-6 border border-white/30 transform hover:-translate-y-1 transition duration-500">
    <h2 class="text-2xl font-bold mb-2 text-center">Create a New Election</h2>
    <p class="text-sm text-gray-600 mb-6 text-center">Admins can add election details, candidates, and time limits.</p>

    <form id="electionForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Election Title</label>
        <input type="text" id="title" class="w-full border p-2 rounded" placeholder="e.g., City Mayor Election 2025" required />
      </div>

      <div id="candidatesContainer" class="space-y-4">
        <div class="border p-3 rounded-md candidate-block bg-white/30">
          <h3 class="font-semibold mb-2 text-sm">Candidate 1</h3>
          <label class="block text-xs mb-1">Candidate Name</label>
          <input type="text" class="candidate-name w-full border p-2 rounded mb-2" placeholder="Enter name" required />
          <label class="block text-xs mb-1">Party Name</label>
          <input type="text" class="candidate-party w-full border p-2 rounded mb-2" placeholder="Enter party name" required />
          <label class="block text-xs mb-1">Upload Photo</label>
          <input type="file" class="candidate-photo w-full border p-2 rounded" accept="image/*" required />
        </div>
      </div>

      <button type="button" id="addCandidate" class="px-3 py-1 bg-indigo-100 rounded text-sm hover:bg-indigo-200">+ Add Another Candidate</button>

      <div class="grid grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium mb-1">Start Time</label>
          <input type="datetime-local" id="startTime" class="w-full border p-2 rounded" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">End Time</label>
          <input type="datetime-local" id="endTime" class="w-full border p-2 rounded" required />
        </div>
      </div>

      <button type="submit" class="w-full py-2 mt-4 rounded bg-yellow-600 text-white hover:bg-yellow-700">Create Election</button>
    </form>

    <p id="status" class="mt-4 text-center text-sm"></p>

    <!-- Admin Election List -->
    <section class="mt-10">
      <h3 class="text-xl font-bold mb-4 text-center">🗳️ All Elections</h3>
      <div id="electionsList" class="space-y-4"></div>
    </section>
  </main>

  <!-- Vote Modal -->
  <div id="voteModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white w-11/12 md:w-2/3 lg:w-1/2 rounded-lg shadow-xl overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center">
        <h3 class="text-lg font-semibold">🗳️ Votes List</h3>
        <button onclick="closeModal()" class="text-red-600 hover:text-red-800 font-bold text-xl">&times;</button>
      </div>
      <div class="p-4 max-h-[400px] overflow-y-auto">
        <table class="min-w-full border">
          <thead class="bg-gray-100 text-sm">
            <tr>
              <th class="p-2 border">#</th>
              <th class="p-2 border">Voter Name</th>
              <th class="p-2 border">Voter ID</th>
              <th class="p-2 border">Candidate</th>
            </tr>
          </thead>
          <tbody id="voteTableBody" class="text-sm"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const LS_KEYS = { ELECTIONS: 'decenvote_elections', VOTES: 'decenvote_votes' };
    function getStore(key){ return JSON.parse(localStorage.getItem(key) || '[]'); }
    function setStore(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

    const container = document.getElementById('candidatesContainer');
    const addBtn = document.getElementById('addCandidate');
    const form = document.getElementById('electionForm');
    const status = document.getElementById('status');
    const electionsList = document.getElementById('electionsList');
    const voteModal = document.getElementById('voteModal');
    const voteTableBody = document.getElementById('voteTableBody');

    let candidateCount = 1;

    addBtn.addEventListener('click', () => {
      candidateCount++;
      const block = document.createElement('div');
      block.className = 'border p-3 rounded-md candidate-block bg-white/30';
      block.innerHTML = `
        <h3 class="font-semibold mb-2 text-sm">Candidate ${candidateCount}</h3>
        <label class="block text-xs mb-1">Candidate Name</label>
        <input type="text" class="candidate-name w-full border p-2 rounded mb-2" placeholder="Enter name" required />
        <label class="block text-xs mb-1">Party Name</label>
        <input type="text" class="candidate-party w-full border p-2 rounded mb-2" placeholder="Enter party name" required />
        <label class="block text-xs mb-1">Upload Photo</label>
        <input type="file" class="candidate-photo w-full border p-2 rounded" accept="image/*" required />
      `;
      container.appendChild(block);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const startTime = new Date(document.getElementById('startTime').value).getTime();
      const endTime = new Date(document.getElementById('endTime').value).getTime();
      const candidateBlocks = document.querySelectorAll('.candidate-block');
      const candidates = [];

      for (const block of candidateBlocks) {
        const name = block.querySelector('.candidate-name').value.trim();
        const party = block.querySelector('.candidate-party').value.trim();
        const photoFile = block.querySelector('.candidate-photo').files[0];
        if (!photoFile) { alert('Please upload all candidate photos'); return; }
        const photoDataUrl = await fileToDataUrl(photoFile);
        candidates.push({ id: crypto.randomUUID(), name, party, photo: photoDataUrl, votes: 0 });
      }

      const elections = getStore(LS_KEYS.ELECTIONS);
      elections.push({ id: crypto.randomUUID(), title, candidates, startsAt: startTime, endsAt: endTime, status: 'Active' });
      setStore(LS_KEYS.ELECTIONS, elections);
      form.reset();
      renderElections();
      status.textContent = '✅ Election created successfully!';
      status.className = 'mt-4 text-center text-green-600';
    });

    function renderElections(){
      const elections = getStore(LS_KEYS.ELECTIONS);
      const votes = getStore(LS_KEYS.VOTES);
      electionsList.innerHTML = '';
      if (!elections.length){
        electionsList.innerHTML = '<p class="text-center text-gray-500">No elections created yet.</p>';
        return;
      }

      elections.forEach(e => {
        const electionVotes = votes.filter(v => v.electionId === e.id);
        const candidateVotes = {};
        electionVotes.forEach(v => { candidateVotes[v.candidateId] = (candidateVotes[v.candidateId] || 0) + 1; });

        const div = document.createElement('div');
        div.className = 'bg-white/40 border p-4 rounded-lg shadow';
        div.innerHTML = `
          <h4 class="text-lg font-semibold">${e.title}</h4>
          <p class="text-sm text-gray-700">⏰ ${new Date(e.startsAt).toLocaleString()} - ${new Date(e.endsAt).toLocaleString()}</p>
          <p class="text-sm font-semibold text-blue-800 mt-1">Status: ${e.status}</p>
          <div class="mt-3 space-y-2">
            ${e.candidates.map(c => `
              <div class="flex items-center justify-between bg-white/70 p-2 rounded">
                <div class="flex items-center space-x-2">
                  <img src="${c.photo}" class="w-10 h-10 rounded-full border" />
                  <div>
                    <p class="font-semibold">${c.name}</p>
                    <p class="text-xs text-gray-600">${c.party}</p>
                  </div>
                </div>
                <span class="font-semibold text-green-700">${candidateVotes[c.id] || 0} votes</span>
              </div>`).join('')}
          </div>
          <div class="flex justify-end space-x-3 mt-4">
            <button onclick="stopElection('${e.id}')" class="px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">Stop</button>
            <button onclick="declareResults('${e.id}')" class="px-3 py-1 bg-green-600 text-white rounded text-xs hover:bg-green-700">Declare</button>
            <button onclick="viewVotes('${e.id}')" class="px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">View Votes</button>
          </div>`;
        electionsList.appendChild(div);
      });
    }

    function stopElection(id){
      const elections = getStore(LS_KEYS.ELECTIONS);
      const e = elections.find(x => x.id === id);
      if (e){ e.status = 'Stopped'; setStore(LS_KEYS.ELECTIONS, elections); renderElections(); }
    }

    function declareResults(id){
      const elections = getStore(LS_KEYS.ELECTIONS);
      const e = elections.find(x => x.id === id);
      if (!e) return;
      e.status = 'Results Declared';
      setStore(LS_KEYS.ELECTIONS, elections);
      alert(`Results declared for "${e.title}"`);
      renderElections();
    }

    function viewVotes(id){
      const votes = getStore(LS_KEYS.VOTES).filter(v => v.electionId === id);
      voteTableBody.innerHTML = '';
      if (!votes.length){
        voteTableBody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">No votes yet.</td></tr>`;
      } else {
        votes.forEach((v, i) => {
          voteTableBody.innerHTML += `
            <tr>
              <td class="border p-2 text-center">${i+1}</td>
              <td class="border p-2">${v.voterName || 'Anonymous'}</td>
              <td class="border p-2">${v.voterId || 'N/A'}</td>
              <td class="border p-2">${v.candidateName}</td>
            </tr>`;
        });
      }
      voteModal.classList.remove('hidden');
      voteModal.classList.add('flex');
    }

    function closeModal(){
      voteModal.classList.add('hidden');
      voteModal.classList.remove('flex');
    }

    function fileToDataUrl(file){
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    renderElections();
  </script>
</body>
</html>
